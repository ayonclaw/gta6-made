<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SALMORA — a coastal crime story</title>
  <meta name="description" content="Salmora: an original open-world crime sandbox that runs offline in the browser." />
  <meta name="theme-color" content="#0b0f11" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./src/hud.css" />

  <!-- three.js ships inside this folder; the map documents the bare specifier -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>

  <style>
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f11;
      z-index: 40;
      transition: opacity 0.7s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 54px);
      letter-spacing: 0.4em;
      color: #f3e7d0;
      text-align: center;
    }
    #boot p {
      margin: 14px 0 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #8d8577;
      text-align: center;
    }
    .no-script {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f3e7d0;
      font-family: Georgia, serif;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Salmora, a coastal city seen from the street"></canvas>

  <div id="hud"></div>

  <div id="boot">
    <div class="boot-inner">
      <h1>SALMORA</h1>
      <p>paving the coast road</p>
    </div>
  </div>

  <noscript>
    <div class="no-script">Salmora needs JavaScript and WebGL to build its streets.</div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
